name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -B
      - run: shasum -a 256 macvdmtool > SHA256SUMS
      - run: gh release upload "$GITHUB_REF_NAME" macvdmtool SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
